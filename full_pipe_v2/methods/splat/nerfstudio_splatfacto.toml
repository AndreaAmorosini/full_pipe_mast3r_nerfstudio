name = "nerfstudio-commands"
step_type = "nerf" # Questo può essere usato per più step (process, train, export)
description = "Wrapper per nerfstudio_commands.py (process, train, export)."

[installation]
# Crea un ambiente locale isolato per Nerfstudio e le sue dipendenze
conda_env_name = "nerfstudio_env"
conda_channels = ["pytorch", "nvidia", "conda-forge"]
conda_packages = [
    "python=3.10",
    "pycolmap==0.6.1", # Dipendenza di ns-process-data
    "pyceres==2.1"
]

# Installa Pytorch, tcnn, gsplat, nerfstudio, ecc.
pip_packages = [
    "torch==2.1.2+cu118", # Dal Dockerfile
    "torchvision==0.16.2+cu118", # Dal Dockerfile
    "git+https://github.com/NVlabs/tiny-cuda-nn/tree/master/bindings/torch", # Dal Dockerfile
    "git+https://github.com/cvg/Hierarchical-Localization.git", # hloc, dal Dockerfile
    "git+https://github.com/nerfstudio-project/gsplat.git", # v1.0.0 è un esempio, il tuo Dockerfile usa una versione dinamica
    "nerfstudio", # Installa la versione base
    "git+https://github.com/KevinXu02/splatfacto-w" # Dal Dockerfile
]

[execution]
# Questo comando usa Jinja2 per cambiare modalità
# in base a 'config.mode' passato dalla pipeline.toml
command = """
conda run --prefix {{env_path}} python scripts/nerfstudio_commands.py \
{% if config.mode == 'frame_extraction' %}
    --frame-extraction \
    --data-path "{{inputs.video_path}}" \
    --output-dir "{{outputs.image_dir}}" \
    --frame-count "{{config.frame_count | default(300)}}" \
{% elif config.mode == 'train_export' %}
    --data-path "{{inputs.image_dir}}" \
    --output-dir "{{outputs.model_dir}}" \
    --model "{{config.model | default('splatfacto')}}" \
    --max-num-iterations "{{config.max_iterations | default(30000)}}" \
    --num-downscales "{{config.num_downscales | default(8)}}" \
    {% if config.use_mcmc %}--use-mcmc{% endif %} \
    {% if config.advanced %}--advanced{% endif %} \
    {% if config.skip_colmap %}
        --skip-colmap \
        --colmap-model-path "{{inputs.colmap_dir}}"
    {% endif %}
{% else %}
    echo "Errore: 'config.mode' non specificato per nerfstudio-commands"
{% endif %}
"""

# Definiamo TUTTI gli input e output possibili
[execution.inputs]
video_path = "string"   # Per mode='frame_extraction'
image_dir = "string"    # Per mode='train_export'
colmap_dir = "string"   # Per mode='train_export' (opzionale)

[execution.outputs]
image_dir = "{{step_output_dir}}"            # Per mode='frame_extraction'
model_dir = "{{step_output_dir}}"            # Per mode='train_export'
final_ply = "{{step_output_dir}}/splat/splat.ply" # Prodotto da 'train_export'
# 'primary_output' dipende dalla modalità, lo gestiamo nella pipeline.toml

[validation]
validation_command = "conda run --prefix {{env_path}} python -c 'import nerfstudio; import tinycudann; import gsplat; print(\"Nerfstudio Env OK\")'"